name: Bug 报告
description: 报告可复现的插件问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: zotero-version
    attributes:
      label: Zotero版本
      placeholder: 例如 9.0.6
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 0.3.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿上传包含私人文献、令牌或未公开论文的截图和日志。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
